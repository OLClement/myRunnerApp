services:
  - name: myrunner-api
    type: web
    runtime: python
    plan: free
    rootDir: api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.6
      - key: DATABASE_URL
        sync: false
      - key: STRAVA_CLIENT_ID
        sync: false
      - key: STRAVA_CLIENT_SECRET
        sync: false
      - key: STRAVA_REDIRECT_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_ACCESS_TTL_MIN
        value: "120"
      - key: JWT_REFRESH_TTL_DAYS
        value: "30"
      - key: GROQ_API_KEY
        sync: false
